fields:
    name:
        label: Name
        span: left
        required: 1
        type: text
    date:
        label: Date
        mode: date
        span: right
        default: now
        type: datepicker
    description:
        label: 'pensoft.media::lang.plugin.description'
        size: large
        span: auto
        type: richeditor
    image:
        label: Image
        mode: image
        fileTypes: svg,png,jpg
        imageWidth: '200'
        useCaption: true
        thumbOptions:
            mode: crop
            extension: auto
        span: auto
        type: fileupload
        comment: 'Preview image shown on this press release''s link cards (e.g. the Resources page)'
    link:
        label: Links
        prompt: 'Add new item'
        maxItems: '5'
        style: default
        span: auto
        type: repeater
        form:
            fields:
                text:
                    label: 'Link text'
                    span: auto
                    type: text
                url:
                    label: 'Link URL'
                    span: auto
                    type: text
    category:
        label: Category
        nameFrom: title
        descriptionFrom: description
        span: auto
        type: relation
