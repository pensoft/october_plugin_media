fields:
    name:
        label: Name
        span: auto
        required: 1
        type: text
    description:
        label: 'Short description'
        size: small
        span: auto
        type: richeditor
    file:
        label: File
        span: left
        mode: file
        useCaption: true
        thumbOptions:
            mode: crop
            extension: auto
        required: 0
        type: fileupload
    captions:
        label: 'Captions track (WebVTT)'
        commentAbove: 'Upload a .vtt caption track for the video file above. Required by WCAG 1.2.2 - review auto-generated captions for accuracy before uploading them here.'
        span: left
        mode: file
        fileTypes: vtt
        required: 0
        type: fileupload
    transcript:
        label: Transcript
        commentAbove: 'Plain-text transcript shown under the video, for people who cannot use captions.'
        size: small
        span: auto
        type: richeditor
    youtube_url:
        label: 'Youtube URL'
        span: left
        required: 0
        type: text
    vimeo_url:
        label: 'Vimeo URL'
        span: left
        required: 0
        type: text
    published_at:
        label: 'Publish at'
        mode: datetime
        span: auto
        type: datepicker
    type:
        label: Type
        options:
            1: 'Project video'
            2: 'Relevant video'
            3: 'Other video'
        showSearch: true
        span: auto
        type: dropdown
    country:
        label: Country
        nameFrom: name
        descriptionFrom: description
        span: auto
        type: relation
    category_id:
        label: Category
        type: dropdown
        placeholder: 'Select Category'
        span: auto
